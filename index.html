<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Songho</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #1a0e00;
      --board:    #2d1a00;
      --pit:      #3d2600;
      --seed:     #d4a84b;
      --nord:     #5b9bd5;
      --sud:      #e05c2a;
      --border:   #5a3a10;
      --muted:    #8a6a40;
    }

    body {
      background-color: var(--bg);
      color: #fff;
      font-family: 'Georgia', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    .dots {
      position: absolute; inset: 0; pointer-events: none;
      background-image: radial-gradient(circle, #fff8e8 1px, transparent 1px);
      background-size: 24px 24px;
      opacity: .07;
    }

    .container {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center; gap: 2.5rem;
      max-width: 420px; width: 100%;
    }

    h1 {
      font-size: 4rem;
      color: var(--seed);
      letter-spacing: -1px;
      text-align: center;
    }
    .subtitle {
      font-family: sans-serif;
      font-size: .75rem;
      letter-spacing: .25em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: .25rem;
      text-align: center;
    }

    .btn-mode {
      display: flex; align-items: center; gap: 1rem;
      width: 100%;
      background: var(--board);
      border: 2px solid var(--border);
      border-radius: 1rem;
      padding: 1.1rem 1.25rem;
      color: #fff;
      text-decoration: none;
      cursor: pointer;
      transition: border-color .2s, transform .15s;
      position: relative;
    }
    .btn-mode:hover { transform: scale(1.02); }
    .btn-mode.local:hover  { border-color: var(--sud); }
    .btn-mode.remote:hover { border-color: var(--nord); }

    .icon {
      width: 48px; height: 48px;
      border-radius: .75rem;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
      border: 1px solid var(--border);
      background: var(--pit);
      flex-shrink: 0;
    }
    .btn-mode.local  .icon { border-color: rgba(224,92,42,.5); }
    .btn-mode.remote .icon { border-color: rgba(91,155,213,.5); }

    .btn-mode .label { font-size: 1.1rem; font-weight: bold; }
    .btn-mode .desc  { font-family: sans-serif; font-size: .8rem; color: var(--muted); margin-top: .15rem; }
    .btn-mode .arrow { position: absolute; right: 1.25rem; opacity: 0; transition: opacity .2s; font-size: 1.2rem; }
    .btn-mode.local  .arrow { color: var(--sud); }
    .btn-mode.remote .arrow { color: var(--nord); }
    .btn-mode:hover .arrow { opacity: 1; }

    footer {
      position: fixed; bottom: 1rem; width: 100%; text-align: center;
      font-family: sans-serif; font-size: .65rem;
      letter-spacing: .2em; text-transform: uppercase;
      color: rgba(138,106,64,.5);
    }
  </style>
</head>
<body>
  <div class="dots"></div>
  <div class="container">
    <div>
      <h1>Songho</h1>
      <p class="subtitle">Jeu traditionnel camerounais</p>
    </div>

    <div style="display:flex;flex-direction:column;gap:1rem;width:100%;">
      <a href="local.html" class="btn-mode local">
        <div class="icon">🖥</div>
        <div>
          <div class="label">Jeu local</div>
          <div class="desc">2 joueurs sur le même écran</div>
        </div>
        <span class="arrow">→</span>
      </a>

      <a href="remote.html" class="btn-mode remote">
        <div class="icon">📡</div>
        <div>
          <div class="label">Jeu en réseau</div>
          <div class="desc">2 joueurs sur des navigateurs distincts</div>
        </div>
        <span class="arrow">→</span>
      </a>
    </div>
  </div>

  <footer>KANNINKA IYA ISAMEL &bull; 24G2152</footer>
</body>
</html>
